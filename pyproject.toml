[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dreamer"
version = "0.1.0"
description = "R2-Dreamer: Redundancy-Reduced World Models without Decoders or Augmentation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.8.0",
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "moviepy==1.0.3",
    "cloudpickle>=1.2.0",
    "numpy==1.26.0",
    "hydra-core==1.3.2",
    "gymnasium==1.2.0",
    "tensorboard>=2.20,<3",
    "setuptools==77.0.3",
]

[project.optional-dependencies]
atari = ["ale_py==0.11.2", "opencv-python==4.7.0.72", "Pillow>=9"]

[dependency-groups]
dev = ["pre-commit>=4"]

[tool.setuptools.packages.find]
include = ["envs*", "optim*"]
