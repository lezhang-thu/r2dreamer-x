defaults:
  - env: atari_return
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'
save_episodes: False

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 1000000
  device: ${device}
  #storage_device: ${device}
  storage_device: 'cpu'
  online: True
  update_latents: False

trainer:
  steps: ${env.steps}
  pretrain: 0
  # Legacy evaluation settings; OnlineTrainer no longer schedules evaluation.
  eval_every: 0
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}

return_exploration:
  enabled: True
  # Ordinary collection only; return-and-explore interactions are counted separately.
  interval: 100000
  episodes: 100
  initial_policy: null
  classifier:
    backbone: facebook/dinov3-vitl16-pretrain-lvd1689m
    feature_batch_size: 16
    gru_steps: 5000
    window: 20
    batch_size: 64
    eval_every: 250
    eval_pairs: 512
    tbptt_chunk: 0
  policy:
    updates: 10000
    batch_size: 4
    unroll_length: 2048
    score_every: 1000
